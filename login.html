<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=, initial-scale=1.0">
  <title>Document</title>
</head>
<style>


   h1 {
    color: white;
    font-size: 40px;
    text-decoration: underline;
  }

  .container {
    position: relative;
    width: 400px;
    height: 400px;
    padding: 30px 40px;
    border: 1px solid;
    border-radius: 15px;
    text-align: center;
    background: transparent;
    backdrop-filter: blur(5px);
    justify-items:center ;
  }

  body {
    background: url('2.jpg') no-repeat;
    background-size: cover;
    background-position: center;
    justify-content: center;
    align-items: center;
    display: flex;
    min-height: 100vh;
  }

  button {
    border: none;
    border-radius: 25px;
    font-size: 30px;
    background: rgb(255, 115, 0);
    text-decoration: none;
    margin: 100px;
    margin-bottom: 3px;
    width: 390px;
    height: 40px;
  }

  button :hover {
    font-size: 32px;
    font-family:Georgia, 'Times New Roman', Times, serif;
  }
  
  .input-box {
    margin: 40px 0 20px;
    width: 100%;
    height: 40%;
  }

  input {
    width: 50%;
    height: 100%;
    background: transparent;
    outline: none;
    font-size: 17px;
    text-indent: 8px;
    color: white;
    padding: 0 35px 0 5px;
    border-radius: 10px;
  }

  input::placeholder {
    color:rgb(255, 85, 0);
  }

  input:focus,
  input:valid {
    border: 2px solid grey;
    color:white;
  }

  p {
    color: white;
    font-size: 20px;
  }
</style>
<body> 

  <div class="container">
    <form action="">
      <h1>LOGIN</h1>

      <div class="input-box">
        <input type="text" placeholder="Username" required>
      </div>

      <div class="input-box">
        <input type="text" placeholder="Password" required>
      </div>

      <button><a href="http://pornhub.com">Login</a></button>

      <p><a href="create.html">Create an account</a></p>
    </form>
  </div>
</body>
</html>
