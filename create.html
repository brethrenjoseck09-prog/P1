<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  h1 {
    color: white;
    font-size: 40px;
    text-decoration: underline;
  }
  .container {
    position: relative;
    width: 400px;
    height: 100%;
    padding: 30px 40px;
    border: 1px solid;
    border-radius: 15px;
    text-align: center;
    background: transparent;
    backdrop-filter: blur(5px);
    justify-items:center ;
  }

  body {
    background: url('2.jpg') no-repeat;
    background-size: cover;
    background-position: center;
    justify-content: center;
    align-items: center;
    display: flex;
    min-height: 100vh;
  }

   button {
    border: none;
    border-radius: 20px;
    font-size: 30px;
    background: rgb(255, 115, 0);;
    text-decoration: none;
    margin: 100px;
    margin-bottom: 3px;
    width: 350px;
    height: 40px;
  }

  input {
    width: 50%;
    height: 100%;
    background: transparent;
    outline: none;
    font-size: 1.3em;
    text-indent: 8px;
    color: white;
    padding: 0 35px 0 5px;
    border-radius: 10px;
    margin-bottom: 20px;
  }

  button{
    text-decoration: none;
  }

   input::placeholder {
    color:rgb(255, 85, 0);
  }

  input:focus,
  input:valid {
    border: 2px solid grey;
    color:white;
    
  }
</style>
<body>
   <div class="container">
    <form action="">
      <h1>CREATE ACCOUNT</h1>

      <div class="input_box">
        <input type="text" placeholder="Username" required>
      </div>

      <div class="input_box">
        <input type="text" placeholder="Name" required>
      </div>

      
      <div class="input_box">
        <input type="text" placeholder="Phone number/ email" required>
      </div>

      <div class="input_box">
        <input type="text" placeholder="Create Password" required>
      </div>
      <button><a href="http://moviebox.com">Create</a></button>

      <p><a href="login.html">Already have an account</a></p>
</body>
</html>
